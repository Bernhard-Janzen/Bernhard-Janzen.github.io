<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vielen Dank | Bernhard Janzen</title>
  <meta name="robots" content="noindex">
  <style>
    *{box-sizing:border-box}
    body{
      margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
      padding:24px;font-family:Inter,Segoe UI,Arial,sans-serif;background:#f6f7f9;color:#171a1f
    }
    .card{
      width:min(680px,100%);background:#fff;border:1px solid #e6e8ec;border-radius:28px;
      padding:48px 36px;box-shadow:0 18px 50px rgba(17,24,39,.07);text-align:center
    }
    .check{
      width:70px;height:70px;border-radius:50%;display:flex;align-items:center;justify-content:center;
      margin:0 auto 24px;background:#111827;color:#fff;font-size:34px;font-weight:800
    }
    h1{font-size:40px;margin:0 0 16px;letter-spacing:-1px}
    p{font-size:17px;line-height:1.65;color:#596170;margin:0 auto 24px;max-width:520px}
    .name{font-weight:800;color:#171a1f;margin-top:26px}
    .sub{font-size:13px;text-transform:uppercase;letter-spacing:1.5px;color:#7b8491;margin-top:5px}
    a{
      display:inline-flex;align-items:center;justify-content:center;text-decoration:none;
      background:#111827;color:#fff;padding:14px 22px;border-radius:14px;font-weight:800;margin-top:26px
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="check">✓</div>
    <h1>Vielen Dank!</h1>
    <p>
      Ihre Anfrage wurde erfolgreich übermittelt. Ich prüfe Ihre Angaben und
      melde mich persönlich bei Ihnen.
    </p>
    <div class="name">Bernhard Janzen</div>
    <div class="sub">Business Solutions · Strom & Gas</div>
    <a href="https://bernhard-janzen.github.io/">Zurück zur Strom-&-Gas-Seite</a>
  </main>
</body>
</html>
